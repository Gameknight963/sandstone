name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix example

      - name: Run unit tests
        run: npm test

      - name: Build standalone HTML
        run: |
          npm run build:prod
          npm run build:prod --prefix example

      - name: Install test browser
        run: npx --no-install playwright-core install --with-deps --only-shell chromium

      - name: Test the standalone file
        env:
          # Use Playwright's bundled headless shell. The full Chromium channel
          # can crash Playwright's frame tracker during cross-process swaps.
          BROWSER_CHANNEL: headless
        run: npm run test:browser

      - name: Test real relay networking
        env:
          BROWSER_CHANNEL: headless
        run: npm run test:relay

      - name: Prepare download
        run: cp example/bundled.html example/dist/sandstone.html

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v7
        with:
          name: sandstone
          path: example/dist/sandstone.html
          if-no-files-found: error
          compression-level: 9
          retention-days: 90
          archive: true

      - name: Link latest download
        env:
          NIGHTLY_URL: https://nightly.link/${{ github.repository }}/workflows/build.yaml/${{ github.event.repository.default_branch }}/sandstone.zip
        run: printf '[Download the latest successful default-branch build](%s)\n' "$NIGHTLY_URL" >> "$GITHUB_STEP_SUMMARY"
