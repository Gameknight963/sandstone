<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sandstone</title>
    <link rel="icon" type="image/png" href="resources/logo_128.png">
    <link rel="stylesheet" href="resources/main.css">
  </head>
  <body>
    <div id="address_bar">
      <div id="favicon_container">
        <p id="favicon_text" style="display: none;">...</p>
        <img id="favicon_img" width="24px" height="24px">
      </div>
      <input id="url_box" type="text" placeholder="Enter URL here..." value="sandstone://home">
      <button id="navigate_button">Submit</button>
      <button id="options_button">Options</button>
      <button id="hide_ui_button" title="Hide controls">Hide</button>
    </div>
    <button id="show_ui_button" hidden title="Show controls">Show UI</button>
    <div id="frame_container"></div>

    <div id="options_div" style="display: none;">
      <div style="display: flex;">
        <h2 style="margin: 0px;">Options:</h2>
        <div style="flex-grow: 1"></div>
        <button id="close_options_button">X</button>
      </div>
      
      <div style="display: flex; gap: 8px;">
        <label for="wisp_url_input">Wisp URL:</label>
        <input id="wisp_url_input" type="text" style="flex-grow: 1">
      </div>
      
      <div style="display: flex; gap: 8px;">
        <label for="theme_select">Theme:</label>
        <select id="theme_select">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>

      <div>
        <label><input id="allow_webrtc_input" type="checkbox" aria-describedby="webrtc_description"> Allow WebRTC</label>
        <p id="webrtc_description" style="font-size: 12px;">WebRTC connects outside the Wisp relay and may expose your IP address. Changing this setting reloads the current site.</p>
        <p id="webrtc_status" role="status" style="font-size: 12px;"></p>
      </div>

      <details id="site_data_details">
        <summary>Stored site data</summary>
        <p id="storage_status" role="status"></p>
        <div id="site_data_list"></div>
      </details>

      <div style="display: flex; gap: 8px;">
        <p style="font-size: 16px;">Eval JS:</p>
        <div style="flex-grow: 1"></div>
        <button id="eval_js_button">Run</button>
      </div>
      
      <textarea id="eval_js_input"></textarea>

      <div style="flex-grow: 1"></div>
      <p><a href="https://nightly.link/Gameknight963/sandstone/workflows/build.yaml/main/sandstone.zip" target="_blank" rel="noopener noreferrer">Download latest build (ZIP)</a></p>
      <p id="version_p" style="font-size: 14px;">
        <a href="https://github.com/ading2210/sandstone" target="_blank">
          <i>Sandstone <span id="version_text"></span></i>
        </a>
      </p>
    </div>
    <script src="dist/sandstone_frontend.js" defer></script>
  </body>
</html>
